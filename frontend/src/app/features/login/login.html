<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Hi</h1>

    <div class="field">
      <label for="email">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 7l9 6 9-6" /></svg>
        Email*
      </label>
      <input id="email" type="email" formControlName="email" autocomplete="username" />
      @if (hasError('email', 'required')) { <small>Email is required.</small> }
      @if (hasError('email', 'email')) { <small>Enter a valid email address.</small> }
    </div>

    <div class="field">
      <label for="password">
        <svg viewBox="0 0 24 24"><circle cx="7" cy="12" r="4" /><path d="M11 12h10M17 12v3M20 12v2" /></svg>
        Password*
      </label>
      <div class="password">
        <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
        <button type="button" class="eye" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
          <svg viewBox="0 0 24 24">
            <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" />
            @if (!showPassword()) { <path d="M4 4l16 16" /> }
          </svg>
        </button>
      </div>
      @if (hasError('password', 'required')) { <small>Password is required.</small> }
    </div>

    @if (error()) { <div class="alert">{{ error() }}</div> }

    <button type="submit" class="login-btn" [disabled]="loading()">
      @if (loading()) { <app-loading-spinner [size]="16" /> } @else { LOGIN }
    </button>43sdqwx
  </form>
</div>
